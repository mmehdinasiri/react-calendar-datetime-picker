name: Deploy Documentation

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
  # Trigger docs deployment when a release is created (after npm publish)
  release:
    types: [created]
  # Trigger docs deployment after npm publish completes successfully
  workflow_run:
    workflows: ['Publish to NPM']
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Always run for manual triggers (workflow_dispatch) - allows reruns
    # For automatic triggers:
    # - release events always run (releases are created successfully)
    # - workflow_run: removed conclusion check to allow manual reruns
    #   Note: To prevent automatic runs on failure, use "Run workflow" button (workflow_dispatch)
    #   instead of "Re-run" when you want to manually trigger after a failure
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_run'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # When triggered by workflow_run, checkout the commit SHA from that workflow
        # The ref parameter can accept a commit SHA directly
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from package.json
        id: get_published_version
        run: |
          # Get version directly from package.json
          # This version is used to:
          # - Update docs/package.json to use npm version (when triggered by workflow_run)
          # - Sync to docs/app/config/version.ts for playground
          VERSION=$(node -p "require('./package.json').version")

          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ] || [ "$VERSION" == "undefined" ]; then
            echo "Error: Could not read version from package.json"
            exit 1
          fi

          # Determine npm tag (beta/latest) based on version
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version from package.json: $VERSION (npm tag: $TAG)"

      - name: Ensure docs package.json uses local reference
        if: github.event_name != 'workflow_run'
        run: |
          cd docs
          # Ensure package.json uses local file reference for manual/release triggers
          # This must happen before root install so workspace sees correct reference
          pnpm pkg set "dependencies.react-calendar-datetime-picker=file:../"
          cd ..

      - name: Install dependencies (root)
        if: github.event_name != 'workflow_run'
        run: |
          # Allow lockfile update for manual triggers to handle sync issues
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build library from source (for docs to use)
        if: github.event_name != 'workflow_run'
        run: pnpm run build

      - name: Update docs package.json to use npm version
        if: github.event_name == 'workflow_run'
        run: |
          VERSION="${{ steps.get_published_version.outputs.version }}"
          # Update package.json to use npm version instead of file:../
          cd docs
          pnpm pkg set "dependencies.react-calendar-datetime-picker=$VERSION"
          echo "Updated docs/package.json to use react-calendar-datetime-picker@$VERSION from npm"
          # Verify the change
          echo "Current package.json dependency:"
          pnpm pkg get "dependencies.react-calendar-datetime-picker"
          cd ..
          
          # Clean up old local installation
          rm -rf docs/node_modules/react-calendar-datetime-picker
          rm -rf node_modules/.pnpm/react-calendar-datetime-picker* 2>/dev/null || true
          
          # Run install from root to update workspace lockfile
          # Must use --no-frozen-lockfile to allow lockfile update after package.json change
          echo "Installing dependencies and updating lockfile from root..."
          pnpm install --no-frozen-lockfile
          echo "✅ Lockfile updated successfully"

      - name: Install dependencies (docs)
        if: github.event_name != 'workflow_run'
        run: |
          cd docs
          rm -rf node_modules/react-calendar-datetime-picker
          # Allow lockfile update for manual triggers (workflow_dispatch) to handle sync issues
          # Use frozen-lockfile for release triggers (assumes lockfile is already in sync)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
          cd ..

      - name: Sync version from package.json
        run: |
          # Sync version from root package.json to docs/app/config/version.ts
          # This ensures the playground uses the exact version from package.json
          # (The build script also runs this, but we do it explicitly here for clarity)
          cd docs
          pnpm run sync:version
          cd ..

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build documentation website
        env:
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
        run: pnpm run build:docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
